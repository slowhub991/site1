# Pubblica la pagina demo (sito/demo/) sull'hosting Aruba di targa10.it via FTP,
# poi controlla da internet che il QR del flyer (https://targa10.it/demo/) apra la demo.
# Il resto del sito online non viene toccato: per caricare tutta la cartella sito/
# lancia il workflow a mano con "Carica tutto il sito" attivo (sostituisce la home online).
#
# Da fare una volta sola in GitHub: Settings > Secrets and variables > Actions > New repository secret
#   FTP_SERVER    di solito ftp.targa10.it (è nel pannello Aruba o nella mail di attivazione dell'hosting)
#   FTP_USERNAME  utente FTP dell'hosting
#   FTP_PASSWORD  password FTP
# Facoltativo, nella scheda Variables: FTP_DIR = cartella pubblica sul server, se non è quella di accesso (predefinita ./)
#
# Senza i secrets il workflow non carica nulla e lo scrive nel riepilogo.

name: Pubblica sito su Aruba

on:
  push:
    branches: [claude/nice-knuth-rwtg0h]
    paths:
      - "sito/**"
      - ".github/workflows/pubblica-sito.yml"
  workflow_dispatch:
    inputs:
      tutto_il_sito:
        description: "Carica tutta la cartella sito/ (sostituisce la home online). Spento = solo /demo/"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pubblica-sito
  cancel-in-progress: false

jobs:
  # Fotografia di targa10.it vista da internet: gira sempre, anche senza i secrets FTP.
  stato-dominio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dominio, DNS, web e FTP di targa10.it
        continue-on-error: true
        run: |
          sudo apt-get -qq install -y whois > /dev/null 2>&1 || true
          echo "== Registro .it (whois.nic.it)"
          whois -h whois.nic.it targa10.it 2>&1 | grep -iE "^(Domain|Status|Created|Expire Date|Registrar|  Organization|  Name|Nameservers)|^  [a-z0-9.-]+\.[a-z]+$" | head -20 || true
          echo "== DNS"
          for h in targa10.it www.targa10.it ftp.targa10.it; do echo "$h  A: $(dig +short A "$h" | tr '\n' ' ')"; done
          echo "targa10.it  NS: $(dig +short NS targa10.it | tr '\n' ' ')"
          echo "== Web"
          for u in https://targa10.it/ http://targa10.it/ https://www.targa10.it/ https://targa10.it/demo/; do
            echo "$u -> $(curl -sS -o /dev/null -L --max-time 15 -w '%{http_code} %{url_effective}' "$u" 2>&1 | head -c 200)"
          done
          echo "== Pagina iniziale"
          curl -sSL --max-time 15 https://targa10.it/ 2>/dev/null | grep -io "<title>[^<]*</title>" | head -1 || true
          echo "== FTP"
          timeout 10 bash -c "echo > /dev/tcp/ftp.targa10.it/21" 2>/dev/null && echo "ftp.targa10.it porta 21 aperta" || echo "ftp.targa10.it porta 21 non raggiungibile"
          echo "== Link interni della home online"
          curl -sSL --max-time 15 https://www.targa10.it/ -o home.html 2>/dev/null || true
          grep -oE 'href="[^"#]+' home.html | sed 's/^href="//' | grep -vE '^(mailto:|tel:|javascript:)' | sort -u | while read -r l; do
            case "$l" in http*) u="$l" ;; /*) u="https://www.targa10.it$l" ;; *) u="https://www.targa10.it/$l" ;; esac
            case "$u" in *targa10.it*) echo "$(curl -sS -o /dev/null -L --max-time 15 -w '%{http_code}' "$u" 2>/dev/null) $u" ;; esac
          done
          echo "== Pagine linkate dalla demo"
          for u in https://targa10.it/check-up/ https://targa10.it/; do
            echo "$(curl -sS -o /dev/null -L --max-time 15 -w '%{http_code}' "$u" 2>/dev/null) $u"
          done

  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HA_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - name: Credenziali FTP mancanti
        if: env.HA_FTP != 'true'
        run: echo "::warning title=Sito non pubblicato::Aggiungi i secrets FTP_SERVER, FTP_USERNAME e FTP_PASSWORD in Settings > Secrets and variables > Actions, poi rilancia questo workflow."

      - uses: actions/checkout@v4
        if: env.HA_FTP == 'true'

      # FTP su TLS esplicito (porta 21). Se Aruba lo rifiuta si prova il TLS implicito sulla porta 990.
      - name: Carica su Aruba (FTPS, porta 21)
        id: ftps
        if: env.HA_FTP == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ${{ inputs.tutto_il_sito && './sito/' || './sito/demo/' }}
          server-dir: ${{ format('{0}{1}', vars.FTP_DIR || './', !inputs.tutto_il_sito && 'demo/' || '') }}
          exclude: |
            **/.git*
            **/.git*/**
            **/*.md

      - name: Carica su Aruba (FTPS implicito, porta 990)
        if: env.HA_FTP == 'true' && steps.ftps.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps-legacy
          port: 990
          security: loose
          local-dir: ${{ inputs.tutto_il_sito && './sito/' || './sito/demo/' }}
          server-dir: ${{ format('{0}{1}', vars.FTP_DIR || './', !inputs.tutto_il_sito && 'demo/' || '') }}
          exclude: |
            **/.git*
            **/.git*/**
            **/*.md

      - name: Il QR del flyer apre la demo?
        if: env.HA_FTP == 'true'
        run: |
          prova() {
            local url="$1" atteso="$2" codice
            codice=$(curl -sSL --max-time 20 -o pagina.html -w '%{http_code}' "$url" 2>errore.txt) \
              || codice="nessuna risposta: $(head -c 200 errore.txt)"
            if [ "$codice" = "200" ] && grep -q "$atteso" pagina.html; then
              echo "OK  $url"
              return 0
            fi
            echo "NO  $url -> $codice"
            return 1
          }
          esito=0
          prova "https://targa10.it/demo/" "VMC-850" || esito=1
          prova "https://targa10.it/" "Targa10" || esito=1
          prova "https://www.targa10.it/demo/" "VMC-850" \
            || echo "::warning title=www::www.targa10.it non apre la demo: controlla il record www nel DNS di Aruba."
          if [ "$esito" != 0 ]; then
            if prova "http://targa10.it/demo/" "VMC-850"; then
              echo "::error title=SSL non attivo::Il sito risponde in http ma non in https. Attiva il certificato SSL DV gratuito dal pannello Aruba."
            else
              echo "::error title=Demo non raggiungibile::https://targa10.it/demo/ non apre la demo. Controlla che il dominio punti all'hosting, la cartella FTP (variabile FTP_DIR) e il certificato SSL."
            fi
            exit 1
          fi
          echo "::notice title=QR del flyer OK::https://targa10.it/demo/ apre la demo."
